<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Tic-Tac-Toe game artwork</title>
  <desc id="desc">A modern three-by-three board with coral crosses and navy circles on a mint background.</desc>
  <defs>
    <linearGradient id="bg" x1="80" y1="20" x2="720" y2="490" gradientUnits="userSpaceOnUse">
      <stop stop-color="#BDF6D7"/>
      <stop offset="1" stop-color="#54BFAE"/>
    </linearGradient>
    <linearGradient id="panel" x1="260" y1="80" x2="540" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3FFF8"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-30%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#145F58" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="36" fill="url(#bg)"/>
  <path d="M0 402C125 331 206 473 339 411c135-63 236-37 461 38v51H0Z" fill="#0E746E" opacity=".12"/>
  <circle cx="104" cy="92" r="120" fill="#FFFFFF" opacity=".13"/>
  <circle cx="706" cy="92" r="82" fill="none" stroke="#FFFFFF" stroke-opacity=".22" stroke-width="3"/>
  <g transform="rotate(-5 400 250)" filter="url(#shadow)">
    <rect x="226" y="55" width="348" height="390" rx="40" fill="url(#panel)"/>
    <rect x="250" y="79" width="300" height="300" rx="26" fill="#E4F5EC"/>
    <path d="M350 91v276M450 91v276M262 179h276M262 279h276" stroke="#9CCBBE" stroke-width="6" stroke-linecap="round"/>
    <g stroke="#FF806F" stroke-width="13" stroke-linecap="round">
      <path d="m286 111 50 50m0-50-50 50"/>
      <path d="m386 211 50 50m0-50-50 50"/>
      <path d="m486 311 50 50m0-50-50 50"/>
    </g>
    <g fill="none" stroke="#17395C" stroke-width="13">
      <circle cx="500" cy="135" r="29"/>
      <circle cx="300" cy="235" r="29"/>
      <circle cx="400" cy="335" r="29"/>
    </g>
    <g transform="translate(267 397)">
      <circle cx="12" cy="11" r="10" fill="#FF806F"/>
      <text x="31" y="16" fill="#17395C" font-family="Arial, sans-serif" font-size="16" font-weight="700">Your turn</text>
      <rect x="184" y="0" width="72" height="24" rx="12" fill="#DDF8B1"/>
      <text x="206" y="17" fill="#43651A" font-family="Arial, sans-serif" font-size="12" font-weight="700">2 - 1</text>
    </g>
  </g>
  <g transform="translate(98 335) rotate(-8)">
    <rect width="108" height="48" rx="18" fill="#17395C"/>
    <path d="m21 14 20 20m0-20L21 34" stroke="#FF806F" stroke-width="6" stroke-linecap="round"/>
    <text x="55" y="30" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="700">THREE</text>
  </g>
</svg>
