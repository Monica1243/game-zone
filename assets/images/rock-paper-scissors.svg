<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Rock Paper Scissors game artwork</title>
  <desc id="desc">Rock, paper, and scissors symbols face off on a vivid violet arena.</desc>
  <defs>
    <linearGradient id="bg" x1="60" y1="25" x2="750" y2="470" gradientUnits="userSpaceOnUse">
      <stop stop-color="#B6A8FF"/>
      <stop offset="1" stop-color="#6555CC"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity=".98"/>
      <stop offset="1" stop-color="#ECE9FF" stop-opacity=".92"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-35%" width="170%" height="190%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#2E216F" flood-opacity=".3"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="36" fill="url(#bg)"/>
  <circle cx="400" cy="250" r="205" fill="none" stroke="#FFFFFF" stroke-opacity=".12" stroke-width="3"/>
  <circle cx="400" cy="250" r="154" fill="#372A91" opacity=".13"/>
  <path d="M55 83h130M615 421h130" stroke="#FFFFFF" stroke-opacity=".28" stroke-width="4" stroke-linecap="round"/>
  <g filter="url(#shadow)">
    <g transform="translate(93 153) rotate(-8 115 115)">
      <circle cx="115" cy="115" r="112" fill="url(#disc)" stroke="#FFFFFF" stroke-width="5"/>
      <path d="m62 127 17-54 40-24 46 18 17 42-26 58-64 9-30-49Z" fill="#75849A" stroke="#344662" stroke-width="7" stroke-linejoin="round"/>
      <path d="m79 73 38 35 48-41M92 176l25-68 39 59" fill="none" stroke="#AEB9C6" stroke-width="6" stroke-linejoin="round"/>
      <text x="115" y="210" fill="#344662" font-family="Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">ROCK</text>
    </g>
    <g transform="translate(284 89)">
      <circle cx="115" cy="115" r="112" fill="#193B60" stroke="#FFFFFF" stroke-opacity=".4" stroke-width="5"/>
      <rect x="68" y="48" width="94" height="126" rx="12" fill="#FFFFFF"/>
      <path d="M135 48v28h27" fill="#D8DFF0"/>
      <path d="M88 101h54M88 123h54M88 145h36" stroke="#6B72D8" stroke-width="7" stroke-linecap="round"/>
      <text x="115" y="210" fill="#FFFFFF" font-family="Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">PAPER</text>
    </g>
    <g transform="translate(483 159) rotate(8 115 115)">
      <circle cx="115" cy="115" r="112" fill="url(#disc)" stroke="#FFFFFF" stroke-width="5"/>
      <g fill="none" stroke="#E56884" stroke-width="11" stroke-linecap="round">
        <circle cx="79" cy="142" r="25"/>
        <circle cx="141" cy="142" r="25"/>
        <path d="m96 124 67-74M124 124 65 57"/>
      </g>
      <circle cx="110" cy="112" r="9" fill="#344662"/>
      <text x="115" y="210" fill="#344662" font-family="Arial, sans-serif" font-size="13" font-weight="800" letter-spacing="2" text-anchor="middle">SCISSORS</text>
    </g>
  </g>
  <g transform="translate(326 405)">
    <rect width="148" height="42" rx="21" fill="#B8F24B"/>
    <text x="74" y="27" fill="#173A5E" font-family="Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1" text-anchor="middle">CHOOSE ONE</text>
  </g>
</svg>
