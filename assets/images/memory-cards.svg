<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc">
  <title id="title">Memory Cards game artwork</title>
  <desc id="desc">Six playful cards reveal matching stars and moons on a warm coral game table.</desc>
  <defs>
    <linearGradient id="bg" x1="55" y1="20" x2="745" y2="485" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFD7A7"/>
      <stop offset="1" stop-color="#EF826F"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#904E83"/>
      <stop offset="1" stop-color="#5D3B77"/>
    </linearGradient>
    <filter id="shadow" x="-35%" y="-30%" width="170%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#8D443C" flood-opacity=".25"/>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#FFFFFF" opacity=".23"/>
    </pattern>
  </defs>
  <rect width="800" height="500" rx="36" fill="url(#bg)"/>
  <circle cx="690" cy="70" r="135" fill="#FFF5D9" opacity=".16"/>
  <circle cx="92" cy="450" r="160" fill="#A74868" opacity=".1"/>
  <path d="M86 112c72-76 122 34 196-17s124-32 180 4c58 38 111-31 249 15" fill="none" stroke="#FFFFFF" stroke-opacity=".2" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 14"/>
  <g filter="url(#shadow)">
    <g transform="translate(155 95) rotate(-7 75 105)">
      <rect width="150" height="210" rx="22" fill="url(#back)" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="5"/>
      <rect x="12" y="12" width="126" height="186" rx="14" fill="url(#dots)" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="2"/>
      <path d="m75 68 12 25 28 4-20 20 5 28-25-13-25 13 5-28-20-20 28-4Z" fill="#FFD86B" opacity=".95"/>
    </g>
    <g transform="translate(325 70) rotate(4 75 105)">
      <rect width="150" height="210" rx="22" fill="#FFFDF6" stroke="#FFFFFF" stroke-width="5"/>
      <rect x="13" y="13" width="124" height="184" rx="14" fill="#F4EBDD"/>
      <path d="m75 57 14 29 32 5-23 22 5 32-28-15-28 15 5-32-23-22 32-5Z" fill="#F6B94F"/>
      <circle cx="75" cy="105" r="49" fill="none" stroke="#F0C978" stroke-opacity=".45" stroke-width="3"/>
    </g>
    <g transform="translate(500 101) rotate(8 75 105)">
      <rect width="150" height="210" rx="22" fill="url(#back)" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="5"/>
      <rect x="12" y="12" width="126" height="186" rx="14" fill="url(#dots)" stroke="#FFFFFF" stroke-opacity=".25" stroke-width="2"/>
      <path d="M75 66a39 39 0 1 0 35 57 42 42 0 0 1-35-57Z" fill="#A4E5DE"/>
    </g>
    <g transform="translate(230 292) rotate(5 60 82)">
