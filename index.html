<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Play Rock Paper Scissors and Tic-Tac-Toe right in your browser — no downloads, no installs.">
  <meta name="theme-color" content="#f7f5ec">
  <link rel="icon" type="image/svg+xml" href="assets/icon/game_zone_favicon.svg">
  <title>Game Zone — Two Classics, One Place</title>
  <link rel="stylesheet" href="css/main.css">
  <script src="scripts/main.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#games">Skip to the game library</a>

  <header class="site-header" data-site-header>
    <div class="site-header__inner">
      <a class="brand" href="#top" aria-label="Game Zone home">
        <img class="brand__logo" src="assets/icon/game_zone_logo.svg" alt="Game Zone — Play Without Limits">
      </a>
    </div>
  </header>

  <main id="top">
    <section class="games-section" id="games" aria-labelledby="games-title">
      <div class="games-section__inner">
        <div class="section-heading">
          <div>
            <p class="section-kicker">Choose your challenge</p>
            <h2 id="games-title">Pick a game.</h2>
          </div>
          <p>Two classic strategy games — quick to start, easy to play, right in your browser.</p>
        </div>

        <p class="catalog-count" data-result-count aria-live="polite">Showing all 2 games</p>

        <div class="game-grid" data-game-grid>
          <!-- Cards rendered dynamically from data/games.json -->
        </div>

        <div class="empty-state" data-empty-state hidden>
          <span aria-hidden="true">?</span>
          <h3>No games found</h3>
          <p>Try another search or choose a different category.</p>
          <button type="button" class="empty-state__reset" data-reset-catalog>Show all games</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
